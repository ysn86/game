<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ファイナルソード - レトロRPG</title>
<style>
  html,body{
    margin:0; padding:0; background:#000; color:#fff;
    font-family:'MS Gothic','Hiragino Kaku Gothic ProN',monospace;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  #wrap{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; justify-content:center; gap:8px;
  }
  canvas{
    background:#000;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    width:min(100vw, 640px);
    max-height:80vh;
    aspect-ratio:480/448;
    outline:none;
  }
  /* ---- タッチ操作パッド ---- */
  #pad{
    display:none;
    width:min(100vw,640px);
    justify-content:space-between; align-items:center;
    padding:4px 12px 16px; box-sizing:border-box;
  }
  body.touch #pad{ display:flex; }
  #dpad{
    display:grid;
    grid-template-columns:56px 56px 56px;
    grid-template-rows:56px 56px 56px;
  }
  #pad button{
    background:#222; color:#eee; border:2px solid #777; border-radius:8px;
    font-size:20px; font-family:inherit;
    touch-action:none;
  }
  #pad button:active{ background:#555; }
  #dpad .sp{ visibility:hidden; }
  #ab{ display:flex; gap:16px; }
  #ab button{ width:64px; height:64px; border-radius:50%; font-size:22px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="480" height="448"></canvas>
  <div id="pad">
    <div id="dpad">
      <button class="sp"></button><button data-b="up">▲</button><button class="sp"></button>
      <button data-b="left">◀</button><button class="sp"></button><button data-b="right">▶</button>
      <button class="sp"></button><button data-b="down">▼</button><button class="sp"></button>
    </div>
    <div id="ab">
      <button data-b="b">B</button>
      <button data-b="a">A</button>
    </div>
  </div>
</div>

<script>
// ドット絵の自前生成（タイル & キャラクター & モンスター）
(function(){
window.RPG = window.RPG || {};

function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

// 疑似乱数（タイル模様用・毎回同じ見た目になるように）
function makeRnd(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }

// ---- パターン文字列 → 16x16 スプライト ----
function pat(rows, pal){
  const c=cv(16,16), g=c.getContext('2d');
  for(let y=0;y<16;y++){
    const row=rows[y]||'';
    for(let x=0;x<16;x++){
      const ch=row[x];
      if(ch && ch!=='.' && pal[ch]){ g.fillStyle=pal[ch]; g.fillRect(x,y,1,1); }
    }
  }
  return c;
}
function flipX(src){
  const c=cv(src.width,src.height), g=c.getContext('2d');
  g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0);
  return c;
}

// ---- タイル生成 ----
function tile(fn, seed){
  const c=cv(16,16), g=c.getContext('2d'), rnd=makeRnd(seed||12345);
  fn(g, rnd); return c;
}
function speckle(g,rnd,color,n){
  g.fillStyle=color;
  for(let i=0;i<n;i++){ g.fillRect((rnd()*16)|0,(rnd()*16)|0,1,1); }
}

const TILES = {};
TILES.grass = tile((g,r)=>{ g.fillStyle='#1e7c30'; g.fillRect(0,0,16,16); speckle(g,r,'#2f9c44',14); speckle(g,r,'#166024',6); },11);
TILES.forest = tile((g,r)=>{
  g.drawImage(TILES.grass,0,0);
  g.fillStyle='#0d4a1c'; g.fillRect(3,2,10,9); g.fillRect(5,1,6,11);
  g.fillStyle='#187a2e'; g.fillRect(4,3,4,3); g.fillRect(8,5,4,4);
  g.fillStyle='#5a3a1a'; g.fillRect(7,11,2,4);
},22);
TILES.mountain = tile((g,r)=>{
  g.drawImage(TILES.grass,0,0);
  g.fillStyle='#7a6a58'; g.beginPath(); g.moveTo(1,15); g.lineTo(8,2); g.lineTo(15,15); g.closePath(); g.fill();
  g.fillStyle='#9c8c78'; g.beginPath(); g.moveTo(4,15); g.lineTo(8,5); g.lineTo(12,15); g.closePath(); g.fill();

},33);

},55);
TILES.towngate = tile((g,r)=>{

  g.fillStyle='#8a8a94'; g.fillRect(3,5,2,9); g.fillRect(11,5,2,9);
  g.fillStyle='#d03030'; g.beginPath(); g.moveTo(2,5); g.lineTo(8,1); g.lineTo(14,5); g.closePath(); g.fill();

<script>
// サウンド（Web Audio APIによるファミコン風BGM・効果音の自前生成）
// 外部音源ファイルは使わず、矩形波・三角波・ノイズをその場で合成する
(function(){
window.RPG = window.RPG || {};

function freq(name){ // 'C#4' → 周波数
  const m = /^([A-G])(#?)(-?\d)$/.exec(name);
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0);
  const midi = (parseInt(m[3],10)+1)*12 + base;
  return 440*Math.pow(2,(midi-69)/12);
}

// ---- 楽曲データ ----
// notes: [音名(0=休符), 拍数] / lead=矩形波, bass=三角波
const SONGS = {
  title: { bpm:100,
    lead:[['C4',.5],['E4',.5],['G4',.5],['B4',.5],['C5',2],
          ['A3',.5],['C4',.5],['E4',.5],['G4',.5],['A4',2],
          ['F3',.5],['A3',.5],['C4',.5],['E4',.5],['F4',2],
          ['G3',.5],['B3',.5],['D4',.5],['F4',.5],['G4',2]],
    bass:[['C3',4],['A2',4],['F2',4],['G2',4]] },
  field: { bpm:112,
    lead:[['A4',.5],['B4',.5],['C5',.5],['E5',.5],['D5',.5],['C5',.5],['B4',1],
          ['G4',.5],['A4',.5],['B4',.5],['D5',.5],['C5',.5],['B4',.5],['A4',1],
          ['A4',.5],['B4',.5],['C5',.5],['E5',.5],['G5',.5],['F5',.5],['E5',1],
          ['D5',.5],['E5',.5],['F5',.5],['E5',.5],['D5',.5],['B4',.5],['A4',1]],
    bass:[['A2',1],['E3',1],['A2',1],['E3',1],
          ['G2',1],['D3',1],['G2',1],['D3',1],
          ['F2',1],['C3',1],['F2',1],['C3',1],
          ['E2',1],['B2',1],['E2',1],['B2',1]] },
  town: { bpm:104,
    lead:[['C5',.5],['E5',.5],['G5',.5],['E5',.5],['F5',.5],['E5',.5],['D5',1],
          ['D5',.5],['F5',.5],['A5',.5],['F5',.5],['G5',.5],['F5',.5],['E5',1],
          ['E5',.5],['D5',.5],['C5',.5],['D5',.5],['E5',.5],['F5',.5],['G5',1],
          ['A5',.5],['G5',.5],['F5',.5],['D5',.5],['E5',.5],['C5',1.5]],
    bass:[['C3',1],['G2',1],['C3',1],['G2',1],
          ['F2',1],['C3',1],['F2',1],['C3',1],
          ['C3',1],['G2',1],['E3',1],['G2',1],
          ['G2',1],['D3',1],['G2',1],['C3',1]] },
  cave: { bpm:84,
    lead:[['D4',1],['F4',1],['E4',1],['C4',1],
          ['D4',1],['F4',1],['A4',1],['G4',1],
          ['F4',1],['E4',1],['D4',1],['C#4',1],
          ['D4',2],[0,2]],
    bass:[['D2',2],['A2',2],['C2',2],['G2',2],

    lead:[['A4',.5],['A4',.5],['C5',.5],['A4',.5],['D5',.5],['C5',.5],['A4',.5],['G4',.5],
          ['A4',.5],['A4',.5],['C5',.5],['E5',.5],['D5',.5],['C5',.5],['D5',.5],['E5',.5],
          ['F5',.5],['E5',.5],['D5',.5],['C5',.5],['B4',.5],['C5',.5],['D5',.5],['B4',.5],
          ['A4',.5],['G4',.5],['A4',.5],['B4',.5],['C5',.5],['B4',.5],['A4',.5],['G#4',.5]],
    bass:[['A2',.5],['A2',.5],['A2',.5],['A2',.5],['A2',.5],['A2',.5],['G2',.5],['G2',.5],
          ['A2',.5],['A2',.5],['A2',.5],['A2',.5],['A2',.5],['A2',.5],['G2',.5],['G2',.5],

  ending: { bpm:88,
    lead:[['E5',1],['D5',1],['C5',1],['G4',1],

    bass:[['C3',2],['G2',2],['A2',2],['E2',2],
          ['F2',2],['C3',2],['G2',2],['C3',2]] },
};

// ジングル: [音名, 開始秒, 長さ秒]
const JINGLES = {
  victory: [['G4',0,.13],['C5',.13,.13],['E5',.26,.13],['G5',.39,.45],['E5',.84,.14],['G5',.98,.6]],
  levelup: [['C5',0,.1],['D5',.1,.1],['E5',.2,.1],['G5',.3,.1],
            ['C6',.4,.7],['C5',.4,.7],['E5',.4,.7],['G5',.4,.7]],
};

class AudioSys {
  constructor(){
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.want = null;   // 起動前に指定されたBGM
    this.bgm = null;
  }

  // ブラウザの自動再生制限のため、最初のキー/タッチ操作で初期化する
  unlock(){
    if(this.ctx){
      if(this.ctx.state==='suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    if(this.want) this.playBgm(this.want, true);
  }
  toggleMute(){
    this.muted = !this.muted;
    if(this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    return this.muted;
  }

  tone(type, f0, t0, dur, vol, f1){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(f0, t0);
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.012);
    g.gain.setValueAtTime(vol, t0+dur*0.65);
    g.gain.linearRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  noise(t0, dur, vol, fc){
    const n = Math.floor(this.ctx.sampleRate*dur)+1;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc||2000;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.linearRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0+dur+0.02);
  }

  // ---- BGM ----
  playBgm(name, force){
    this.want = name;
    if(!this.ctx) return;
    if(!force && this.bgm && this.bgm.name===name) return;
    this.stopBgm();
    const song = SONGS[name];
    if(!song) return;
    const beat = 60/song.bpm;
    const mk=(notes,type,vol)=>({
      seq: notes.map(([n,b])=>({f:n?freq(n):0, d:b*beat})),
      type, vol, idx:0, t:this.ctx.currentTime+0.06,
    });
    const tracks=[ mk(song.lead,'square',0.055), mk(song.bass,'triangle',0.09) ];
    const tick=()=>{
      if(!this.ctx) return;
      const horizon = this.ctx.currentTime + 0.25;
      tracks.forEach(tr=>{
        while(tr.t < horizon){
          const n = tr.seq[tr.idx];
          if(n.f) this.tone(tr.type, n.f, tr.t, Math.min(n.d*0.92, n.d), tr.vol);
          tr.t += n.d;
          tr.idx = (tr.idx+1)%tr.seq.length;
        }
      });
    };
    tick();
    this.bgm = { name, timer:setInterval(tick, 80) };
  }
  stopBgm(){
    if(this.bgm){ clearInterval(this.bgm.timer); this.bgm=null; }
  }

  // ---- ジングル（勝利・レベルアップ）: BGMを止めて演奏 ----
  jingle(name){
    this.want = null;
    if(!this.ctx) return;
    this.lastJingle = name;
    this.stopBgm();
    const t0=this.ctx.currentTime+0.03;
    (JINGLES[name]||[]).forEach(([n,at,dur])=>{
      this.tone('square', freq(n), t0+at, dur, 0.07);
      this.tone('triangle', freq(n)/2, t0+at, dur, 0.08);
    });
  }

  // ---- 効果音 ----
  sfx(name){
    if(!this.ctx) return;
    this.lastSfx = name;
    const t=this.ctx.currentTime+0.01;
    switch(name){
      case 'hit':       // 攻撃ヒット
        this.noise(t,0.13,0.35,1400);
        this.tone('square',190,t,0.13,0.22,70);
        break;
      case 'crit':      // 会心の一撃
        this.noise(t,0.24,0.5,2200);
        this.tone('square',280,t,0.26,0.28,45);
        break;
      case 'miss':      // ミス・かわす
        this.noise(t,0.16,0.16,5000);
        break;
      case 'phit':      // プレイヤー被ダメージ
        this.tone('square',120,t,0.22,0.26,45);
        this.noise(t,0.16,0.3,700);
        break;
      case 'spell':     // 攻撃呪文
        this.tone('square',330,t,0.09,0.18);
        this.tone('square',495,t+0.08,0.09,0.18);
        this.tone('square',740,t+0.16,0.16,0.18);
        this.noise(t+0.16,0.2,0.15,3000);
        break;
      case 'heal':      // 回復
        this.tone('sine',523,t,0.1,0.2);
        this.tone('sine',659,t+0.09,0.1,0.2);
        this.tone('sine',784,t+0.18,0.24,0.2);
        break;
      case 'encounter': // エンカウント
        for(let i=0;i<3;i++){
          this.tone('square',220,t+i*0.11,0.06,0.2);
          this.tone('square',311,t+i*0.11+0.055,0.06,0.2);
        }
        break;
      case 'flee':      // 逃走
        this.tone('square',620,t,0.3,0.16,140);
        break;
    }
  }
}

RPG.audio = new AudioSys();

<script>
// キーボード & タッチ入力
(function(){
window.RPG = window.RPG || {};

const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right',
  z:'a', Z:'a', Enter:'a', ' ':'a',
  x:'b', X:'b', Escape:'b',
};

class Input {
  constructor(){
    this.held = new Set();
    this.listeners = [];
  }
  attach(){
    window.addEventListener('keydown', e=>{
      const b = KEYMAP[e.key];
      if(!b) return;
      e.preventDefault();
      if(!e.repeat){ this.held.add(b); this.emit(b); }
    });
    window.addEventListener('keyup', e=>{
      const b = KEYMAP[e.key];
      if(b) this.held.delete(b);
    });
    window.addEventListener('blur', ()=> this.held.clear());
  }
  bindTouch(el, btn){
    el.addEventListener('pointerdown', e=>{
      e.preventDefault();
      this.held.add(btn); this.emit(btn);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>
      el.addEventListener(ev, ()=> this.held.delete(btn)));
    el.addEventListener('contextmenu', e=>e.preventDefault());
  }
  emit(b){ this.listeners.slice().forEach(fn=>fn(b)); }
  onPress(fn){ this.listeners.push(fn); }
  isHeld(b){ return this.held.has(b); }
  heldDir(){
    for(const d of ['up','down','left','right']) if(this.held.has(d)) return d;
    return null;
  }
}

RPG.Input = Input;
})();
</script>
<script>
// ウィンドウ描画・メッセージ・選択メニュー（すべて共通のウィンドウ関数で統一）
(function(){
window.RPG = window.RPG || {};

const FONT = "16px 'MS Gothic','Hiragino Kaku Gothic ProN',monospace";
const LINE_H = 24;
const CHARS_PER_LINE = 26;

function wrap(text){
  const out = [];
  String(text).split('\n').forEach(line=>{
    if(line==='') { out.push(''); return; }
    for(let i=0;i<line.length;i+=CHARS_PER_LINE) out.push(line.slice(i,i+CHARS_PER_LINE));
  });
  return out;
}

class UI {
  constructor(){
    this.widgets = [];
    this.time = 0;
  }
  get active(){ return this.widgets.length>0; }

  handlePress(b){
    const w = this.widgets[this.widgets.length-1];
    if(w && w.press) w.press(b);
  }
  update(dt){
    this.time += dt;
    this.widgets.forEach(w=>{ if(w.update) w.update(dt); });
  }
  render(g){
    this.widgets.forEach(w=>w.render(g));
  }

  // 共通ウィンドウ描画
  win(g,x,y,w,h){
    g.fillStyle='rgba(4,4,20,0.94)';
    g.fillRect(x,y,w,h);
    g.strokeStyle='#f0f0f0'; g.lineWidth=3;
    g.strokeRect(x+3,y+3,w-6,h-6);
    g.strokeStyle='#707080'; g.lineWidth=1;
    g.strokeRect(x+7,y+7,w-14,h-14);
  }
  text(g,s,x,y,color){
    g.font=FONT; g.textBaseline='top';
    g.fillStyle=color||'#f0f0f0';
    g.fillText(s,x,y);
  }

  // メッセージ表示（1文字ずつ・Aキーで送り / 3行ごとに改ページ）
  message(text, opts={}){
    const ui=this;
    return new Promise(res=>{
      const lines = wrap(text);
      const pages=[];
      for(let i=0;i<lines.length;i+=3) pages.push(lines.slice(i,i+3));
      const wd={
        x:opts.x??16, y:opts.y??324, w:opts.w??448, h:opts.h??108,
        page:0, chars:0,
        pageLen(){ return this.pages[this.page].join('').length; },
        pages,
        update(dt){ this.chars += dt*40; },
        press(b){
          if(b!=='a' && b!=='b') return;
          if(this.chars < this.pageLen()){ this.chars = this.pageLen(); return; }
          if(this.page < this.pages.length-1){ this.page++; this.chars=0; return; }
          ui.widgets.splice(ui.widgets.indexOf(this),1);
          res();
        },
        render(g){
          ui.win(g,this.x,this.y,this.w,this.h);
          let remain = Math.floor(this.chars);
          const rows = this.pages[this.page];
          for(let i=0;i<rows.length;i++){
            const s = rows[i].slice(0, Math.max(0,remain));
            remain -= rows[i].length;
            ui.text(g, s, this.x+16, this.y+14+i*LINE_H);
          }
          if(this.chars>=this.pageLen() && Math.floor(ui.time*2)%2===0){
            ui.text(g,'▼', this.x+this.w/2-8, this.y+this.h-22);
          }
        },
      };
      ui.widgets.push(wd);
    });
  }

  // 選択メニュー。戻り値: 選んだindex / キャンセルは -1
  choose(items, opts={}){
    const ui=this;
    return new Promise(res=>{
      const labels = items.map(i=> typeof i==='string' ? i : i.label);
      const width = opts.w ?? (Math.max(...labels.map(s=>s.length), (opts.title||'').length)*16 + 64);
      const height = labels.length*LINE_H + 28 + (opts.title?24:0);
      const wd={
        x:opts.x??16, y:opts.y??16, cur:0, labels,
        press(b){
          if(b==='up'){ this.cur=(this.cur+labels.length-1)%labels.length; }
          else if(b==='down'){ this.cur=(this.cur+1)%labels.length; }
          else if(b==='a'){
            ui.widgets.splice(ui.widgets.indexOf(this),1);
            res(this.cur);
          }
          else if(b==='b' && opts.cancel!==false){
            ui.widgets.splice(ui.widgets.indexOf(this),1);
            res(-1);
          }
        },
        render(g){
          ui.win(g,this.x,this.y,width,height);
          let ty=this.y+14;
          if(opts.title){ ui.text(g,opts.title,this.x+16,ty,'#f0d060'); ty+=24; }
          labels.forEach((s,i)=>{
            if(i===this.cur) ui.text(g,'▶',this.x+12,ty+i*LINE_H);
            ui.text(g,s,this.x+32,ty+i*LINE_H, items[i]&&items[i].dim?'#8a8a96':'#f0f0f0');
          });
        },
      };
      ui.widgets.push(wd);
    });
  }

  // 情報パネル（何かキーを押すまで表示）
  panel(lines, opts={}){
    const ui=this;
    return new Promise(res=>{
      const rows = Array.isArray(lines)?lines:wrap(lines);
      const width = opts.w ?? (Math.max(...rows.map(s=>s.length))*16+48);
      const height = opts.h ?? (rows.length*LINE_H+28);
      const wd={
        x:opts.x??16, y:opts.y??16,
        press(b){
          if(b!=='a'&&b!=='b') return;
          ui.widgets.splice(ui.widgets.indexOf(this),1);
          res();
        },
        render(g){
          ui.win(g,this.x,this.y,width,height);
          rows.forEach((s,i)=> ui.text(g,s,this.x+16,this.y+14+i*LINE_H));
        },
      };
      ui.widgets.push(wd);
    });
  }
}

RPG.UI = UI;
})();
</script>
<script>
// プレイヤー状態・セーブ/ロード
(function(){
window.RPG = window.RPG || {};
const SAVE_KEY = 'hikari_no_takara_save1';

RPG.newState = function(){
  return {
    name:'ゆうしゃ',
    level:1, exp:0, hp:16, mp:0, gold:50,
    weapon:'stick', armor:'clothes',
    weapons:['stick'], armors:['clothes'],
    items:[{id:'herb', n:2}],
    spells:[],
    poisoned:false,
    flags:{},
    map:'town', x:5, y:3, dir:'up',
  };
};

RPG.lvl   = s => RPG.DB.LEVELS[s.level-1];
RPG.maxhp = s => RPG.lvl(s).hp;
RPG.maxmp = s => RPG.lvl(s).mp;
RPG.atk   = s => RPG.lvl(s).str + (RPG.DB.WEAPONS[s.weapon] ? RPG.DB.WEAPONS[s.weapon].atk : 0);
RPG.def   = s => RPG.lvl(s).vit + (RPG.DB.ARMORS[s.armor] ? RPG.DB.ARMORS[s.armor].def : 0);

RPG.addItem = (s,id,n=1)=>{
  const it = s.items.find(i=>i.id===id);
  if(it) it.n+=n; else s.items.push({id,n});
};
RPG.removeItem = (s,id,n=1)=>{
  const it = s.items.find(i=>i.id===id);
  if(!it) return;
  it.n-=n;
  if(it.n<=0) s.items.splice(s.items.indexOf(it),1);
};
RPG.hasItem = (s,id)=> s.items.some(i=>i.id===id && i.n>0);

RPG.rand = (a,b)=> a + Math.floor(Math.random()*(b-a+1));

// 経験値からレベルアップ処理。表示すべきメッセージの配列を返す
RPG.checkLevelUp = function(s){
  const msgs=[];
  while(s.level < RPG.DB.MAX_LEVEL && s.exp >= RPG.DB.LEVELS[s.level].exp){
    const before = RPG.DB.LEVELS[s.level-1];
    s.level++;
    const now = RPG.DB.LEVELS[s.level-1];
    s.hp = Math.min(RPG.maxhp(s), s.hp + (now.hp-before.hp));
    s.mp = Math.min(RPG.maxmp(s), s.mp + (now.mp-before.mp));
    let m = s.name+'は レベル'+s.level+'に あがった!\n'
      + 'ちから+'+(now.str-before.str)+'  みのまもり+'+(now.vit-before.vit)
      + '  さいだいHP+'+(now.hp-before.hp);
    msgs.push(m);
    if(now.learn && !s.spells.includes(now.learn)){
      s.spells.push(now.learn);
      msgs.push(s.name+'は じゅもん '+RPG.DB.SPELLS[now.learn].name+'を おぼえた!');
    }
  }
  return msgs;
};

RPG.save   = s  => { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); };
RPG.load   = () => {
  try{
    const j = localStorage.getItem(SAVE_KEY);
    return j ? JSON.parse(j) : null;
  }catch(e){ return null; }
};
RPG.hasSave = () => !!localStorage.getItem(SAVE_KEY);
})();
</script>
<script>
// 戦闘システム（ドラクエ1風 1対1ターン制）
(function(){
window.RPG = window.RPG || {};
const R = RPG.rand;

function physDamage(atk, def){
  const base = atk/2 - def/4;
  const dmg = Math.floor(base * (0.8 + Math.random()*0.4));
  return Math.max(1, dmg);
}

// 戻り値: 'win' | 'lose' | 'flee'
RPG.runBattle = async function(game, enemyId){
  const E = RPG.DB.ENEMIES[enemyId];
  const ui = game.ui, s = game.state;
  const bs = { enemy:E, ehp:E.hp, visible:true, shake:0, flash:0 };
  game.battle = bs;
  game.mode = 'battle';

  const CMD_POS = {x:16, y:196, cancel:false};
  const SUB_POS = {x:176, y:196};

  await ui.message(E.name+'が あらわれた!');

  let result = null;
  while(!result){
    // ---- プレイヤーのターン ----
    let acted = false;
    while(!acted){
      const c = await ui.choose(['たたかう','じゅもん','どうぐ','にげる'], CMD_POS);
      if(c===0){ // たたかう
        acted = true;
        await ui.message(s.name+'の こうげき!');
        if(Math.random() < 1/16){
          RPG.audio.sfx('miss');
          await ui.message('ミス! ダメージを あたえられない!');
        }else{
          let dmg, crit = Math.random() < 1/24;
          if(crit){
            dmg = Math.max(1, Math.floor(RPG.atk(s)*(0.8+Math.random()*0.25)));
            RPG.audio.sfx('crit');
            await ui.message('かいしんの いちげき!!');
          }else{
            dmg = physDamage(RPG.atk(s), E.def);
            RPG.audio.sfx('hit');
          }
          bs.ehp -= dmg; bs.shake = 0.35;
          await game.sleep(250);
          await ui.message(E.name+'に '+dmg+'の ダメージ!');
        }
      }
      else if(c===1){ // じゅもん
        if(s.spells.length===0){ await ui.message('まだ じゅもんを おぼえていない!'); continue; }
        const list = s.spells.map(id=>{
          const sp=RPG.DB.SPELLS[id];
          return sp.name+'  MP'+sp.mp;
        });
        const i = await ui.choose(list, SUB_POS);
        if(i<0) continue;
        const spId = s.spells[i], sp = RPG.DB.SPELLS[spId];
        if(s.mp < sp.mp){ await ui.message('MPが たりない!'); continue; }
        acted = true;
        s.mp -= sp.mp;
        await ui.message(s.name+'は '+sp.name+'を となえた!');
        if(sp.type==='heal'){
          RPG.audio.sfx('heal');
          const v = Math.min(R(sp.power[0],sp.power[1]), RPG.maxhp(s)-s.hp);
          s.hp += v;
          await ui.message(s.name+'の HPが '+v+' かいふくした!');
        }else{
          RPG.audio.sfx('spell');
          const dmg = R(sp.power[0],sp.power[1]);
          bs.ehp -= dmg; bs.shake = 0.35;
          await game.sleep(250);
          await ui.message(E.name+'に '+dmg+'の ダメージ!');
        }
      }
      else if(c===2){ // どうぐ
        const usable = s.items.filter(it=>RPG.DB.ITEMS[it.id].type!=='key');
        if(usable.length===0){ await ui.message('つかえる どうぐを もっていない!'); continue; }
        const i = await ui.choose(usable.map(it=>RPG.DB.ITEMS[it.id].name+' ×'+it.n), SUB_POS);
        if(i<0) continue;
        const item = RPG.DB.ITEMS[usable[i].id];
        acted = true;
        if(item.type==='heal'){
          RPG.audio.sfx('heal');
          const v = Math.min(R(item.power[0],item.power[1]), RPG.maxhp(s)-s.hp);
          s.hp += v;
          RPG.removeItem(s, usable[i].id);
          await ui.message(s.name+'は '+item.name+'を つかった!\nHPが '+v+' かいふくした!');
        }else if(item.type==='cure'){
          RPG.removeItem(s, usable[i].id);
          if(s.poisoned){ s.poisoned=false; RPG.audio.sfx('heal'); await ui.message('どくが きえさった!'); }
          else await ui.message('しかし なにも おこらなかった。');
        }
      }
      else if(c===3){ // にげる
        acted = true;
        await ui.message(s.name+'は にげだした!');
        if(E.boss){
          await ui.message('しかし まわりこまれてしまった!');
        }else{
          const chance = Math.min(0.9, Math.max(0.3, 0.55 + (s.level - E.exp/8)*0.03));
          if(Math.random() < chance){ RPG.audio.sfx('flee'); result='flee'; break; }
          await ui.message('しかし まわりこまれてしまった!');
        }
      }
    }
    if(result) break;

    if(bs.ehp<=0){
      bs.visible = false;
      await ui.message(E.name+'を たおした!');
      result = 'win';
      break;
    }

    // ---- 敵のターン ----
    let act = 'attack';
    if(E.acts){
      const total = E.acts.reduce((a,[,w])=>a+w,0);
      let roll = Math.random()*total;
      for(const [name,w] of E.acts){ roll-=w; if(roll<=0){ act=name; break; } }
    }
    if(act==='attack'){
      await ui.message(E.name+'の こうげき!');
      if(Math.random() < 1/20){
        RPG.audio.sfx('miss');
        await ui.message(s.name+'は ひらりと みをかわした!');
      }else{
        const dmg = physDamage(E.atk, RPG.def(s));
        s.hp = Math.max(0, s.hp-dmg);
        RPG.audio.sfx('phit');
        bs.flash = 0.3;
        await game.sleep(250);
        await ui.message(s.name+'は '+dmg+'の ダメージを うけた!');
        if(E.poison && !s.poisoned && s.hp>0 && Math.random()<E.poison){
          s.poisoned = true;
          await ui.message(s.name+'は どくを うけてしまった!');
        }
      }
    }else if(act==='fire'){
      const dmg = R(E.fire[0], E.fire[1]);
      s.hp = Math.max(0, s.hp-dmg);
      RPG.audio.sfx('spell');
      RPG.audio.sfx('phit');
      bs.flash = 0.3;
      await ui.message(E.name+'は ほのおのじゅもんを となえた!\n'+s.name+'は '+dmg+'の ダメージを うけた!');
    }else if(act==='breath'){
      const dmg = R(E.breath[0], E.breath[1]);
      s.hp = Math.max(0, s.hp-dmg);
      RPG.audio.sfx('spell');
      RPG.audio.sfx('phit');
      bs.flash = 0.35;
      await ui.message(E.name+'は ほのおを はいた!\n'+s.name+'は '+dmg+'の ダメージを うけた!');
    }

    if(s.hp<=0){ result='lose'; break; }
  }

  // ---- 結果処理 ----
  if(result==='win'){
    RPG.audio.jingle('victory');
    s.exp += E.exp; s.gold += E.gold;
    await ui.message('けいけんち '+E.exp+' を かくとく!\n'+E.gold+'ゴールドを てにいれた!');
    const lvMsgs = RPG.checkLevelUp(s);
    if(lvMsgs.length) RPG.audio.jingle('levelup'); // レベルアップのファンファーレ
    for(const m of lvMsgs) await ui.message(m);
  }

  game.battle = null;
  if(result!=='lose') game.mode = 'field';
  return result;
};
})();
</script>
<script>
// ゲーム本体（フィールド・イベント・メニュー・進行管理）
(function(){
window.RPG = window.RPG || {};

const TILE = 32;           // 画面上のタイルサイズ
const VIEW_W = 480, VIEW_H = 448;
const STEP_SPEED = 5.5;    // タイル/秒（処理落ちしても dt 基準で一定）

const DIRV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

class Game {
  constructor(canvas, input){
    this.canvas = canvas;
    this.g = canvas.getContext('2d');
    this.g.imageSmoothingEnabled = false;
    this.input = input;
    this.ui = new RPG.UI();
    this.mode = 'title';   // title | field | battle | ending
    this.state = null;
    this.map = null;
    this.step = null;
    this.busy = false;
    this.battle = null;
    this.time = 0;
    this.fadeAlpha = 0;
    this.whiteFlash = false;
    this.hurtFlash = 0;

    this.scripts = {
      king: this.scriptKing,
      inn: this.scriptInn,
      weaponShop: this.scriptWeaponShop,
      itemShop: this.scriptItemShop,
    };

    // 動作確認用フック
    this.debug = {
      tp: (m,x,y)=>{ this.loadMap(m); this.state.x=x; this.state.y=y; },
      lvl: n=>{
        const s=this.state;
        s.level=n; s.exp=RPG.DB.LEVELS[n-1].exp;
        s.hp=RPG.maxhp(s); s.mp=RPG.maxmp(s);
        RPG.DB.LEVELS.slice(0,n).forEach(L=>{ if(L.learn && !s.spells.includes(L.learn)) s.spells.push(L.learn); });
      },
      gold: n=>{ this.state.gold=n; },
      give: id=>RPG.addItem(this.state,id),
      equip:(w,a)=>{ this.state.weapon=w; this.state.armor=a;
        if(!this.state.weapons.includes(w))this.state.weapons.push(w);
        if(!this.state.armors.includes(a))this.state.armors.push(a); },
      battle: id=>this.encounterFlow(id),
    };
  }

  start(){
    this.input.attach();
    this.input.onPress(b=>{
      if(this.ui.active){ this.ui.handlePress(b); return; }
      if(this.mode!=='field' || this.busy || this.step) return;
      if(b==='a') this.interactFlow();
      else if(b==='b') this.menuFlow();
    });
    this.titleFlow(true);
    let last = performance.now();
    const loop = t=>{
      const dt = Math.min(0.05,(t-last)/1000); last=t;
      this.update(dt); this.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  bgmForMap(){
    const t=this.map ? this.map.theme : 'field';
    return t==='town' ? 'town' : t==='cave' ? 'cave' : 'field';
  }
  async fadeOut(){ for(let a=0;a<=1.01;a+=0.12){ this.fadeAlpha=Math.min(1,a); await this.sleep(16);} }
  async fadeIn(){ for(let a=1;a>=0;a-=0.12){ this.fadeAlpha=Math.max(0,a); await this.sleep(16);} this.fadeAlpha=0; }

  // ================= マップ =================
  loadMap(name){
    this.map = RPG.MAPS[name];
    if(this.state) this.state.map = name;
  }
  tileCharAt(x,y){
    if(!this.map || y<0||y>=this.map.h||x<0||x>=this.map.w) return '#';
    return this.map.tiles[y][x];
  }
  tileNameAt(x,y){
    const ch = this.tileCharAt(x,y);
    if(ch==='D' && this.state && this.state.flags.door) return 'floor';
    return RPG.tileName(ch, this.map.theme);
  }
  npcAt(x,y){ return (this.map.npcs||[]).find(n=>n.x===x&&n.y===y); }
  chestAt(x,y){ return (this.map.chests||[]).find(c=>c.x===x&&c.y===y); }
  bossAt(x,y){
    return this.map.boss && !this.state.flags.boss &&
      this.map.boss.x===x && this.map.boss.y===y;
  }
  walkable(x,y){
    if(y<0||y>=this.map.h||x<0||x>=this.map.w) return false;
    if(RPG.SOLID.has(this.tileNameAt(x,y))) return false;
    if(this.npcAt(x,y) || this.chestAt(x,y) || this.bossAt(x,y)) return false;
    return true;
  }
  ahead(x,y,dir){ const v=DIRV[dir]; return [x+v[0], y+v[1]]; }

  // ================= 更新 =================
  update(dt){
    this.time += dt;
    this.ui.update(dt);
    if(this.hurtFlash>0) this.hurtFlash-=dt;
    if(this.battle){
      if(this.battle.shake>0) this.battle.shake-=dt;
      if(this.battle.flash>0) this.battle.flash-=dt;
    }
    if(this.mode==='field' && this.state){
      if(this.step){
        this.step.t += dt*STEP_SPEED;
        if(this.step.t>=1){
          const st=this.step; this.step=null;
          this.state.x=st.tx; this.state.y=st.ty;
          this.onArrive();
        }
      } else if(!this.busy && !this.ui.active){
        const d=this.input.heldDir();
        if(d){
          this.state.dir=d;
          const [nx,ny]=this.ahead(this.state.x,this.state.y,d);
          if(this.walkable(nx,ny)) this.step={fx:this.state.x,fy:this.state.y,tx:nx,ty:ny,t:0};
        }
      }
    }
  }

  onArrive(){
    const s=this.state;
    const ch=this.tileCharAt(s.x,s.y);
    if(ch==='p'){ s.hp=Math.max(1,s.hp-2); this.hurtFlash=0.3; }
    if(s.poisoned){ s.hp=Math.max(1,s.hp-1); this.hurtFlash=Math.max(this.hurtFlash,0.15); }
    const w=(this.map.warps||[]).find(w=>w.x===s.x&&w.y===s.y);
    if(w){ this.warpFlow(w); return; }
    const enc=this.map.encounters;
    if(enc && Math.random()<enc.rate){
      const total=enc.table.reduce((a,[,w])=>a+w,0);
      let roll=Math.random()*total, id=enc.table[0][0];
      for(const [e,w] of enc.table){ roll-=w; if(roll<=0){ id=e; break; } }
      this.encounterFlow(id);
    }
  }

  async warpFlow(w){
    this.busy=true;
    await this.fadeOut();
    this.loadMap(w.map);
    RPG.audio.playBgm(this.bgmForMap());
    this.state.x=w.tx; this.state.y=w.ty;
    if(w.dir) this.state.dir=w.dir;
    await this.fadeIn();
    this.busy=false;
  }

  async encounterFlow(enemyId){
    this.busy=true;
    RPG.audio.sfx('encounter');
    for(let i=0;i<3;i++){
      this.whiteFlash=true; await this.sleep(70);
      this.whiteFlash=false; await this.sleep(70);
    }
    RPG.audio.playBgm('battle');
    const r = await RPG.runBattle(this, enemyId);
    if(r==='lose') await this.gameOverFlow();
    else RPG.audio.playBgm(this.bgmForMap());
    this.busy=false;
  }

  async gameOverFlow(){
    await this.ui.message('めのまえが まっくらに なった…');
    const s=this.state;
    s.gold=Math.floor(s.gold/2);
    s.hp=RPG.maxhp(s); s.mp=RPG.maxmp(s); s.poisoned=false;
    this.loadMap('town'); s.x=5; s.y=3; s.dir='up';
    this.mode='field';
    RPG.audio.playBgm('town');
    await this.fadeIn();
    await this.ui.message('※「おお '+s.name+'よ しんでしまうとは なにごとだ!\nそなたに もういちど きかいを あたえよう。\n(しょじきんが はんぶんに なった)');
  }

  // ================= タイトル =================
  async titleFlow(auto){
    this.mode='title';
    this.state=null; this.map=null; this.battle=null; this.fadeAlpha=0;
    RPG.audio.playBgm('title');
    if(auto){
      // 自動スタート: タイトルを少し見せてから、セーブがあれば「つづきから」、
      // なければ「はじめから」を自動で開始する
      await this.sleep(1500);
      const st=RPG.load();
      if(st){
        this.state=st; this.loadMap(st.map); this.mode='field';
        RPG.audio.playBgm(this.bgmForMap());
      }else{
        this.state=RPG.newState(); this.loadMap('town'); this.mode='field';
        RPG.audio.playBgm('town');
        await this.openingFlow();
      }
      return;
    }
    while(true){
      const c=await this.ui.choose(['はじめから','つづきから'],{x:168,y:312,cancel:false});
      if(c===1){
        const st=RPG.load();
        if(!st){ await this.ui.message('ぼうけんのしょが みつかりません。'); continue; }
        this.state=st; this.loadMap(st.map); this.mode='field';
        RPG.audio.playBgm(this.bgmForMap());
        return;
      }
      this.state=RPG.newState(); this.loadMap('town'); this.mode='field';
      RPG.audio.playBgm('town');
      await this.openingFlow();
      return;
    }
  }

  async openingFlow(){
    this.busy=true;
    await this.ui.message('アルテアおうこくの わかもの '+this.state.name+'は\nおうさまに めしだされた ――');
    await this.scripts.king.call(this);
    this.busy=false;
  }

  async endingFlow(){
    await this.fadeOut();
    this.mode='ending';
    this.fadeAlpha=0;
    RPG.audio.playBgm('ending');
    await new Promise(res=>{
      const fn=b=>{
        if(b!=='a') return;
        this.input.listeners.splice(this.input.listeners.indexOf(fn),1);
        res();
      };
      this.input.listeners.push(fn);
    });
    this.titleFlow();
  }

  // ================= しらべる・はなす =================
  async interactFlow(){
    if(this.busy) return;
    this.busy=true;
    try{ await this.interact(); }
    finally{ this.busy=false; }
  }

  async interact(){
    const s=this.state, ui=this.ui;
    let [tx,ty]=this.ahead(s.x,s.y,s.dir);

    if(this.bossAt(tx,ty)){ await this.bossFlow(); return; }

    let npc=this.npcAt(tx,ty);
    if(!npc && this.tileNameAt(tx,ty)==='counter'){
      const [x2,y2]=this.ahead(tx,ty,s.dir);
      npc=this.npcAt(x2,y2);
    }
    if(npc){
      if(npc.script) await this.scripts[npc.script].call(this);
      else for(const l of (npc.lines||[])) await ui.message(l);
      return;
    }

    const chest=this.chestAt(tx,ty);
    if(chest){
      const key='chest:'+s.map+':'+tx+','+ty;
      if(s.flags[key]){ await ui.message('たからばこは からっぽだ。'); return; }
      s.flags[key]=1;
      if(chest.gold){
        s.gold+=chest.gold;
        await ui.message('たからばこを あけた!\n'+chest.gold+'ゴールドを てにいれた!');
      }else if(chest.kind==='armor'){
        if(!s.armors.includes(chest.item)) s.armors.push(chest.item);
        await ui.message('たからばこを あけた!\n'+RPG.DB.ARMORS[chest.item].name+'を てにいれた!');
      }else{
        RPG.addItem(s,chest.item);
        await ui.message('たからばこを あけた!\n'+RPG.DB.ITEMS[chest.item].name+'を てにいれた!');
      }
      return;
    }

    if(this.tileCharAt(tx,ty)==='D' && !s.flags.door){
      if(RPG.hasItem(s,'key')){
        s.flags.door=1;
        await ui.message('まほうのカギを つかった!\nとびらが ひらいた!');
      }else{
        await ui.message('とびらには カギが かかっている。');
      }
      return;
    }
  }

  async bossFlow(){
    const ui=this.ui, s=this.state;
    await ui.message('※「グオオオ… よくぞ ここまで きたな にんげんよ!\n《ひかりのたから》は わたさぬ!!');
    RPG.audio.playBgm('battle');
    const r=await RPG.runBattle(this,'boss');
    if(r==='lose'){ await this.gameOverFlow(); return; }
    RPG.audio.playBgm(this.bgmForMap());
    if(r==='win'){
      s.flags.boss=1;
      RPG.addItem(s,'treasure');
      await ui.message('《ひかりのたから》を とりもどした!\nおうさまに ほうこくしよう!');
    }
  }

  // ================= メニュー =================
  async menuFlow(){
    if(this.busy) return;
    this.busy=true;
    try{
      const s=this.state, ui=this.ui;
      let goTitle=false;
      while(true){
        const c=await ui.choose(['つよさ','じゅもん','どうぐ','そうび','セーブ','タイトルへ'],{x:16,y:16});
        if(c<0) break;
        if(c===5){ // タイトルへ
          await ui.message('セーブしていない ぼうけんは きえてしまうが\nタイトルに もどる?');
          const ok=await ui.choose(['いいえ','はい'],{x:180,y:60});
          if(ok!==1) continue;
          goTitle=true; break;
        }
        if(c===0){
          const L=RPG.lvl(s);
          const next = s.level>=RPG.DB.MAX_LEVEL ? '---' : String(RPG.DB.LEVELS[s.level].exp - s.exp);
          await ui.panel([
            'なまえ:    '+s.name,
            'レベル:    '+s.level,
            'HP:      '+s.hp+'/'+RPG.maxhp(s)+(s.poisoned?' (どく)':''),
            'MP:      '+s.mp+'/'+RPG.maxmp(s),
            'ちから:    '+L.str,
            'みのまもり:  '+L.vit,
            'こうげき力:  '+RPG.atk(s),
            'しゅび力:   '+RPG.def(s),
            'けいけんち:  '+s.exp,
            'つぎのレベル: あと'+next,
            'ゴールド:   '+s.gold+'G',
            'ぶき:     '+RPG.DB.WEAPONS[s.weapon].name,
            'よろい:    '+RPG.DB.ARMORS[s.armor].name,
          ],{x:150,y:24});
        }
        else if(c===1){ // じゅもん
          if(s.spells.length===0){ await ui.message('まだ じゅもんを おぼえていない。'); continue; }
          const i=await ui.choose(s.spells.map(id=>{
            const sp=RPG.DB.SPELLS[id]; return sp.name+'  MP'+sp.mp;
          }),{x:150,y:24,title:'MP '+s.mp+'/'+RPG.maxmp(s)});
          if(i<0) continue;
          const sp=RPG.DB.SPELLS[s.spells[i]];
          if(!sp.field){ await ui.message('たたかいの ときにしか つかえない。'); continue; }
          if(s.mp<sp.mp){ await ui.message('MPが たりない!'); continue; }
          if(s.hp>=RPG.maxhp(s)){ await ui.message('HPは まんたんだ。'); continue; }
          s.mp-=sp.mp;
          RPG.audio.sfx('heal');
          const v=Math.min(RPG.rand(sp.power[0],sp.power[1]), RPG.maxhp(s)-s.hp);
          s.hp+=v;
          await ui.message(sp.name+'を となえた!\nHPが '+v+' かいふくした!');
        }
        else if(c===2){ // どうぐ
          if(s.items.length===0){ await ui.message('なにも もっていない。'); continue; }
          const i=await ui.choose(s.items.map(it=>RPG.DB.ITEMS[it.id].name+' ×'+it.n),{x:150,y:24});
          if(i<0) continue;
          const id=s.items[i].id, item=RPG.DB.ITEMS[id];
          if(item.type==='heal'){
            if(s.hp>=RPG.maxhp(s)){ await ui.message('HPは まんたんだ。'); continue; }
            RPG.audio.sfx('heal');
            const v=Math.min(RPG.rand(item.power[0],item.power[1]), RPG.maxhp(s)-s.hp);
            s.hp+=v; RPG.removeItem(s,id);
            await ui.message(item.name+'を つかった!\nHPが '+v+' かいふくした!');
          }else if(item.type==='cure'){
            RPG.removeItem(s,id);
            if(s.poisoned){ s.poisoned=false; RPG.audio.sfx('heal'); await ui.message('どくが きえさった!'); }
            else await ui.message('しかし なにも おこらなかった。');
          }else if(id==='key'){
            await ui.message('カギのかかった とびらのまえで\nしらべると つかえる。');
          }else{
            await ui.message('まばゆく かがやいている…\nおうさまに とどけよう。');
          }
        }
        else if(c===3){ // そうび
          const t=await ui.choose(['ぶき','よろい'],{x:150,y:24});
          if(t<0) continue;
          if(t===0){
            const i=await ui.choose(s.weapons.map(id=>(id===s.weapon?'E ':'  ')+RPG.DB.WEAPONS[id].name),{x:230,y:24});
            if(i<0) continue;
            s.weapon=s.weapons[i];
            await ui.message(RPG.DB.WEAPONS[s.weapon].name+'を そうびした!');
          }else{
            const i=await ui.choose(s.armors.map(id=>(id===s.armor?'E ':'  ')+RPG.DB.ARMORS[id].name),{x:230,y:24});
            if(i<0) continue;
            s.armor=s.armors[i];
            await ui.message(RPG.DB.ARMORS[s.armor].name+'を そうびした!');
          }
        }
        else if(c===4){ // セーブ
          RPG.save(s);
          await ui.message('ぼうけんのしょに きろくした!');
        }
      }
      if(goTitle){ this.titleFlow(); return; }
    } finally { this.busy=false; }
  }

  // ================= NPCスクリプト =================
  async scriptKing(){
    const ui=this.ui, s=this.state, f=s.flags;
    if(!f.mission){
      await ui.message('※「おお ゆうしゃ'+s.name+'よ! よくぞ まいった。');
      await ui.message('※「ひがしの どうくつに すみつく まもの ドラゴネルが\nくにのたから 《ひかりのたから》を うばって いったのだ。');
      await ui.message('※「どうか たからを とりもどしてくれ!\nしたくきんとして 120ゴールドを さずけよう!');
      s.gold+=120; f.mission=1;
      await ui.message('120ゴールドを てにいれた!\n(Xキー/Bボタンで メニュー。まちで そうびを ととのえよう)');
    } else if(RPG.hasItem(s,'treasure') && !f.clear){
      await ui.message('※「おお! それは まさしく《ひかりのたから》!\nよくぞ とりもどしてくれた '+s.name+'よ!');
      await ui.message('※「そなたこそ まことの ゆうしゃじゃ!\nこのくにの へいわは そなたの おかげじゃ!');
      f.clear=1;
      RPG.save(s);
      await this.endingFlow();
    } else if(f.clear){
      await ui.message('※「'+s.name+'よ ゆっくり やすんでくれ。\nそなたは このくにの えいゆうじゃ!');
    } else {
      await ui.message('※「まものの どうくつは ひがしにある。\nどくのぬまに きをつけるのじゃぞ。');
    }
  }

  async scriptInn(){
    const ui=this.ui, s=this.state;
    await ui.message('※「ようこそ やどやへ!\nひとばん 10ゴールドですが とまりますか?');
    const c=await ui.choose(['はい','いいえ'],{x:340,y:196});
    if(c!==0){ await ui.message('※「またの おこしを おまちしています。'); return; }
    if(s.gold<10){ await ui.message('※「おかねが たりないようですね…'); return; }
    s.gold-=10;
    await this.fadeOut();
    await this.sleep(500);
    s.hp=RPG.maxhp(s); s.mp=RPG.maxmp(s); s.poisoned=false;
    await this.fadeIn();
    await ui.message('※「おはようございます!\nゆうべは ゆっくり やすめましたか?\nいってらっしゃいませ!');
  }

  async scriptWeaponShop(){
    const ui=this.ui, s=this.state;
    await ui.message('※「いらっしゃい! ぶきと ぼうぐの みせだ。');
    const goods=[
      ['w','stick'],['w','copper'],['w','steel'],
      ['a','clothes'],['a','leather'],['a','steelA'],
    ];
    while(true){
      const labels=goods.map(([t,id])=>{
        const d=t==='w'?RPG.DB.WEAPONS[id]:RPG.DB.ARMORS[id];
        return d.name+'  '+d.price+'G';
      });
      const i=await ui.choose(labels,{x:16,y:16,title:'しょじきん '+s.gold+'G'});
      if(i<0) break;
      const [t,id]=goods[i];
      const d=t==='w'?RPG.DB.WEAPONS[id]:RPG.DB.ARMORS[id];
      const owned=(t==='w'?s.weapons:s.armors).includes(id);
      if(owned){ await ui.message('※「それは もう もっているよ。'); continue; }
      if(s.gold<d.price){ await ui.message('※「おかねが たりないようだね。'); continue; }
      const ok=await ui.choose(['かう','やめる'],{x:340,y:196});
      if(ok!==0) continue;
      s.gold-=d.price;
      (t==='w'?s.weapons:s.armors).push(id);
      await ui.message('※「まいど あり!\nメニューの そうびで みにつけておくれ。');
    }
    await ui.message('※「また きておくれ!');
  }

  async scriptItemShop(){
    const ui=this.ui, s=this.state;
    await ui.message('※「いらっしゃいませ! どうぐやです。');
    const goods=['herb','antidote'];
    while(true){
      const labels=goods.map(id=>RPG.DB.ITEMS[id].name+'  '+RPG.DB.ITEMS[id].price+'G');
      const i=await ui.choose(labels,{x:16,y:16,title:'しょじきん '+s.gold+'G'});
      if(i<0) break;
      const id=goods[i], d=RPG.DB.ITEMS[id];
      if(s.gold<d.price){ await ui.message('※「おかねが たりませんよ。'); continue; }
      s.gold-=d.price;
      RPG.addItem(s,id);
      await ui.message('※「ありがとうございます!\n'+d.name+'を てにいれた!');
    }
    await ui.message('※「またの おこしを!');
  }

  // ================= 描画 =================
  render(){
    const g=this.g;
    g.imageSmoothingEnabled=false;
    g.fillStyle='#000'; g.fillRect(0,0,VIEW_W,VIEW_H);

    if(this.mode==='title') this.renderTitle(g);
    else if(this.mode==='field' && this.state) this.renderField(g);
    else if(this.mode==='battle') this.renderBattle(g);
    else if(this.mode==='ending') this.renderEnding(g);

    this.ui.render(g);

    if(this.whiteFlash){ g.fillStyle='#fff'; g.fillRect(0,0,VIEW_W,VIEW_H); }
    if(this.hurtFlash>0){ g.fillStyle='rgba(200,0,60,0.35)'; g.fillRect(0,0,VIEW_W,VIEW_H); }
    if(this.fadeAlpha>0){ g.fillStyle='rgba(0,0,0,'+this.fadeAlpha+')'; g.fillRect(0,0,VIEW_W,VIEW_H); }
  }

  heroPixel(){
    const s=this.state;
    let px=s.x*TILE, py=s.y*TILE;
    if(this.step){
      const t=Math.min(1,this.step.t);
      px=(this.step.fx+(this.step.tx-this.step.fx)*t)*TILE;
      py=(this.step.fy+(this.step.ty-this.step.fy)*t)*TILE;
    }
    return [px,py];
  }

  renderField(g){
    const m=this.map, s=this.state;
    const [hpx,hpy]=this.heroPixel();
    const camX=Math.max(0, Math.min(m.w*TILE-VIEW_W, hpx+TILE/2-VIEW_W/2));
    const camY=Math.max(0, Math.min(m.h*TILE-VIEW_H, hpy+TILE/2-VIEW_H/2));

    const c0=Math.floor(camX/TILE), r0=Math.floor(camY/TILE);
    const c1=Math.min(m.w-1, Math.ceil((camX+VIEW_W)/TILE));
    const r1=Math.min(m.h-1, Math.ceil((camY+VIEW_H)/TILE));
    for(let y=r0;y<=r1;y++){
      for(let x=c0;x<=c1;x++){
        const t=RPG.TILESET[this.tileNameAt(x,y)];
        g.drawImage(t, Math.floor(x*TILE-camX), Math.floor(y*TILE-camY), TILE, TILE);
      }
    }
    // 宝箱
    (m.chests||[]).forEach(c=>{
      const opened=s.flags['chest:'+s.map+':'+c.x+','+c.y];
      g.drawImage(opened?RPG.TILESET.chestOpen:RPG.TILESET.chestClosed,
        Math.floor(c.x*TILE-camX), Math.floor(c.y*TILE-camY), TILE, TILE);
    });
    // NPC
    (m.npcs||[]).forEach(n=>{
      const spr=RPG.SPRITES[n.sprite];
      g.drawImage(spr.down, Math.floor(n.x*TILE-camX), Math.floor(n.y*TILE-camY), TILE, TILE);
    });
    // ボス
    if(m.boss && !s.flags.boss){
      g.drawImage(RPG.MONSTERS.boss, Math.floor(m.boss.x*TILE-camX), Math.floor(m.boss.y*TILE-camY), TILE, TILE);
    }
    // 主人公
    const bob=this.step ? (Math.floor(this.time*10)%2?-2:0) : 0;
    g.drawImage(RPG.SPRITES.hero[s.dir], Math.floor(hpx-camX), Math.floor(hpy-camY)+bob, TILE, TILE);

    // どく状態表示
    if(s.poisoned){
      this.ui.win(g, VIEW_W-96, 8, 88, 40);
      this.ui.text(g,'どく', VIEW_W-72, 20, '#c080f0');
    }
  }

  renderBattle(g){
    const s=this.state, bs=this.battle;
    // ステータス
    if(s){
      this.ui.win(g,16,16,180,128);
      this.ui.text(g,s.name,32,30);
      this.ui.text(g,'HP '+s.hp+'/'+RPG.maxhp(s),32,56,s.hp<=RPG.maxhp(s)/4?'#f08080':'#f0f0f0');
      this.ui.text(g,'MP '+s.mp+'/'+RPG.maxmp(s),32,80);
      this.ui.text(g,'レベル '+s.level,32,104);
    }
    if(bs){
      // 戦闘フレーム
      this.ui.win(g,216,16,248,176);
      g.fillStyle='#0c0c14'; g.fillRect(226,26,228,156);
      if(bs.visible){
        const spr=RPG.MONSTERS[bs.enemy.sprite];
        const size=bs.enemy.boss?128:96;
        const ox=bs.shake>0 ? (Math.random()*10-5) : 0;
        g.drawImage(spr, Math.floor(340-size/2+ox), Math.floor(104-size/2), size, size);
      }
      if(bs.flash>0){ g.fillStyle='rgba(220,0,40,0.35)'; g.fillRect(0,0,VIEW_W,VIEW_H); }
    }
  }

  renderTitle(g){
    g.fillStyle='#000'; g.fillRect(0,0,VIEW_W,VIEW_H);
    g.textAlign='center'; g.textBaseline='top';
    g.font="20px 'MS Gothic',monospace"; g.fillStyle='#8090ff';
    g.fillText('― レトロRPG ―', VIEW_W/2, 72);
    g.font="40px 'MS Gothic',monospace"; g.fillStyle='#f0e060';
    g.fillText('ファイナルソード', VIEW_W/2, 110);
    g.imageSmoothingEnabled=false;
    g.drawImage(RPG.SPRITES.hero.down, VIEW_W/2-32, 180, 64, 64);
    g.font="14px 'MS Gothic',monospace"; g.fillStyle='#c0c0c0';
    g.fillText('矢印キー:いどう  Z/Enter:けってい  X/Esc:キャンセル・メニュー', VIEW_W/2, 262);
    g.fillText('スマホは がめんの ボタンで そうさ  (M:サウンドON/OFF)', VIEW_W/2, 284);
    g.textAlign='left';
  }

  renderEnding(g){
    g.fillStyle='#000'; g.fillRect(0,0,VIEW_W,VIEW_H);
    g.textAlign='center'; g.textBaseline='top';
    g.font="18px 'MS Gothic',monospace"; g.fillStyle='#f0f0f0';
    g.fillText('《ひかりのたから》は おうこくに もどり', VIEW_W/2, 100);
    g.fillText('せかいに へいわが おとずれた。', VIEW_W/2, 132);
    g.fillText('ゆうしゃの でんせつは いつまでも', VIEW_W/2, 180);
    g.fillText('かたりつがれて いくことだろう…', VIEW_W/2, 212);
    g.font="32px 'MS Gothic',monospace"; g.fillStyle='#f0e060';
    g.fillText('～ THE END ～', VIEW_W/2, 280);
    g.font="14px 'MS Gothic',monospace"; g.fillStyle='#909090';
    g.fillText('Z/Enter または Aボタンで タイトルへ', VIEW_W/2, 350);
    g.textAlign='left';
  }
}

RPG.Game = Game;
})();
</script>
<script>
// 起動処理
(function(){
window.addEventListener('load', ()=>{
  const canvas = document.getElementById('screen');
  const input = new RPG.Input();
  const game = new RPG.Game(canvas, input);

  // タッチ端末なら仮想パッドを表示
  if(('ontouchstart' in window) || matchMedia('(pointer:coarse)').matches
     || location.search.includes('touch=1')){
    document.body.classList.add('touch');
  }
  document.querySelectorAll('#pad button[data-b]').forEach(el=>{
    input.bindTouch(el, el.dataset.b);
  });

  // 最初の操作でオーディオを起動（ブラウザの自動再生制限対応）
  input.onPress(()=>RPG.audio.unlock());
  // Mキーでサウンドのミュート切替
  window.addEventListener('keydown', e=>{
    if(e.key==='m'||e.key==='M') RPG.audio.toggleMute();
  });

  game.start();
  window.GAME = game; // 動作確認用フック
});
})();
</script>
</body>
